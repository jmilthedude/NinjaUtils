plugins {
    id 'fabric-loom' version '1.11-SNAPSHOT'
    id 'java'
}

group = project.maven_group
version = "${project.minecraft_version}-${project.mod_version}"
base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url "https://repo.erdbeerbaerlp.de/repository/maven-public/" }
    mavenCentral()
}

loom {
    runs {
        client {
            name "NinjaUtils-Client"
            client()
            runDir "run"
            ideConfigGenerated = true
        }
        server {
            name "NinjaUtils-Server"
            server()
            programArg "nogui"
            ideConfigGenerated = true
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    modImplementation 'de.erdbeerbaerlp:dcintegration.common:3.0.6'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release.set(21)
}

java {
    def jv = JavaVersion.VERSION_21
    if (JavaVersion.current() < jv) {
        toolchain.languageVersion = JavaLanguageVersion.of(21)
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand([
                version: project.version,
                minecraft_version: project.minecraft_version,
                loader_version: project.loader_version
        ])
    }
}
